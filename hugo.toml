baseURL = '/'
locale = 'bn'
title = 'উত্তরপাড়া শ্রীঅরবিন্দ পরিষদ'
theme = 'PaperMod'

paginate = 20

[params]
    description = '“দিব্য জীবন” (The Life Divine) ও “যোগ সমন্বয়” (The Synthesis of Yoga) ধারাবাহিক পাঠ'
    defaultTheme = 'auto'
    showShareButtons = false
    showCodeCopyButtons = false
    mainSections = ["life-divine", "synthesis-of-yoga", "magazine", "reports", "gallery"]
    homeInfoParams = { Title = "উত্তরপাড়া শ্রীঅরবিন্দ পরিষদ", Content = "শ্রীঅরবিন্দ পাঠ, অনুধ্যান, প্রকাশিত পত্রিকা, বার্ষিক প্রতিবেদন এবং পরিষদ সংবাদ" }

