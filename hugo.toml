    showShareButtons = false
    showCodeCopyButtons = false
    mainSections = ["life-divine", "synthesis-of-yoga"]
    homeInfoParams = { Title = "শ্রীঅরবিন্দ পাঠ ও অনুধ্যান", Content = "মানব চেতনার পূর্ণাঙ্গ রূপান্তর ও দিব্য জীবনের আহ্বানে—শ্রীঅরবিন্দের মূল দর্শনের সহজ ও অনুচ্ছেদভিত্তিক বাংলা ভাবার্থ এবং সংক্ষিপ্ত তাৎপর্য।" }

