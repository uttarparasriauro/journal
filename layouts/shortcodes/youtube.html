{{/* Responsive YouTube Video Player / Gallery Shortcode */}}
{{ $id := .Get "id" | default (.Get 0) }}
{{ $title := .Get "title" | default "ভিডিও প্রোগ্রাম" }}

<div class="video-container" style="margin: 1.5rem 0; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.1); background: #000000;">
    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
        <iframe src="https://www.youtube-nocookie.com/embed/{{ $id }}" title="{{ $title }}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"></iframe>
    </div>
    {{ if $title }}
    <div style="padding: 10px 16px; background: var(--entry); font-size: 0.95rem; font-weight: 500; border-top: 1px solid var(--border);">
        🎥 {{ $title }}
    </div>
    {{ end }}
</div>
